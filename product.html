
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | StyleKart</title>
    <link rel="stylesheet" href="product.css">
    <script src="product.js" defer></script>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">STYLEKART</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="wishlist.html">Wishlist ♥</a>
            <a href="bag.html">Bag (<span id="cartCount">0</span>)</a>
        </nav>
    </header>

    <main class="product-container">
        <a href="index.html" class="back-link">← Continue Shopping</a>

        <section id="productDetails" class="product-details">
            <div class="product-gallery">
                <img id="productImage" src="" alt="Product image">
            </div>

            <div class="product-info">
                <p class="eyebrow">STYLEKART COLLECTION</p>
                <h1 id="productName">Loading product...</h1>
                <p id="productPrice" class="price"></p>
                <p id="productDescription" class="description"></p>

                <hr>

                <div class="option-group">
                    <h3>Select Size</h3>
                    <div id="sizeOptions" class="size-options"></div>
                </div>

                <div class="option-group">
                    <h3>Select Color</h3>
                    <div id="colorOptions" class="color-options"></div>
                </div>

                <p id="selectionMessage" class="message" role="status"></p>

                <button id="addToBagBtn" class="add-to-bag-btn">
                    ADD TO BAG
                </button>

                <p class="delivery-note">
                    Easy shopping. Everyday style.
                </p>
            </div>
        </section>

        <section id="productNotFound" class="not-found" hidden>
            <h2>Product not found</h2>
            <p>Please return to StyleKart and select a product.</p>
            <a href="index.html">Back to Home</a>
        </section>
    </main>

    <footer class="footer">
        <p>Style for Every You.</p>
        <p>© 2026 StyleKart | Student Project</p>
    </footer>

</body>
</html>

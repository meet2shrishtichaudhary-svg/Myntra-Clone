<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bag | StyleKart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar bag-navbar">
        <a href="index.html" class="logo">style<span>kart.</span></a>
        <h3>YOUR SHOPPING BAG</h3>
        <a href="index.html" class="continue-link">← Continue Shopping</a>
    </header>

    <main class="bag-page">
        <section class="bag-items-section">
            <h1>My Bag</h1>
            <p id="bagItemCount">Your selected products</p>
            <div id="bagItems" class="bag-items"></div>
        </section>

        <aside class="price-section">
            <h2>PRICE DETAILS</h2>

            <div class="price-row">
                <span>Total MRP</span>
                <span id="totalMRP">₹0</span>
            </div>

            <div class="price-row">
                <span>Discount</span>
                <span id="discount">₹0</span>
            </div>

            <div class="price-row">
                <span>Delivery Fee</span>
                <span id="deliveryFee">₹0</span>
            </div>

            <hr>

            <div class="price-row total-row">
                <strong>Total Amount</strong>
                <strong id="totalAmount">₹0</strong>
            </div>

            <button id="placeOrderBtn" class="place-order-btn">
                PLACE ORDER
            </button>

            <p id="orderMessage" class="order-message"></p>
        </aside>
    </main>

    <script src="bag.js"></script>
</body>
</html>
